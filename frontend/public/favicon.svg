<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2341" />
      <stop offset="100%" stop-color="#051324" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  
  <!-- Stylized Double-Bar T (TAQA Signature) -->
  <path d="M 12 17 L 34 17 C 35.1 17 36 17.9 36 19 C 36 20.1 35.1 21 34 21 L 12 21 C 10.9 21 10 20.1 10 19 C 10 17.9 10.9 17 12 17 Z" fill="url(#cyanGrad)" />
  <rect x="15" y="24" width="4.5" height="23" rx="2" fill="url(#cyanGrad)" />
  <rect x="23.5" y="24" width="4.5" height="23" rx="2" fill="url(#cyanGrad)" />

  <!-- Concentric Energy Ring (TAQA Q Motif) -->
  <circle cx="43" cy="33" r="11" stroke="url(#cyanGrad)" stroke-width="3.5" fill="none" />
  <circle cx="43" cy="33" r="4.5" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <!-- Q Diagonal Energy Slash -->
  <rect x="47" y="38" width="4" height="10" rx="1.5" transform="rotate(-40 47 38)" fill="url(#cyanGrad)" />
</svg>